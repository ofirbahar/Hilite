<style>
{# Gallery white. Every page is white with near-black ink and one blue. Surfaces are told
   apart by a fine edge and a soft shadow, and the blue appears only where something is
   chosen, marked or focused. #}
:root {
  color-scheme: light;
  --paper: #ffffff; --card: #ffffff; --ink: #0b0c0f; --muted: #5d6068; --line: #e3e5ea; --fill: #f4f5f7;
  --on-mark: #ffffff;
  --mark: #1746e0;
  --accent: #1746e0; --accent-press: #0f33b0;
  --night: #0b0c0f; --night-ink: #ffffff; --night-muted: #a3a7b0;
  --good: #17753f; --good-ring: #1f9d57; --good-tint: #e6f5ec;
  --warn: #8a5200; --warn-ring: #e09a12; --warn-tint: #fdf1d8;
  --bad: #c0271f; --bad-ring: #e5483d; --bad-tint: #fdeceb;
  --display: "Heebo", "Segoe UI", Arial, sans-serif;
  --font: "Heebo", "Segoe UI", Arial, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --tint: #dfe6ff; --tint-soft: #eef2ff; --edge: #c9ccd3; --rule: #d9dce2; --btn-hover: #2a2c33; --track: #b9bdc6;
  --shadow: 0 1px 2px rgba(11, 12, 15, 0.05), 0 12px 24px -12px rgba(11, 12, 15, 0.1), 0 40px 80px -40px rgba(11, 12, 15, 0.22);
}
{# The same page at night, for a visitor who asks for it with the switch in the top bar. #}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0e0f12; --card: #16181d; --ink: #f2f3f5; --muted: #a3a7b0; --line: #2a2d34; --fill: #15171b;
  --mark: #2f55e6;
  --accent: #9db3ff; --accent-press: #c0ceff;
  --night: #000000;
  --good: #6fd698; --good-tint: #15301f;
  --warn: #f2b84a; --warn-tint: #33270f;
  --bad: #ff8a7e; --bad-tint: #3a1a17;
  --tint: #26335f; --tint-soft: #161c33; --edge: #3a3e47; --rule: #2a2d34; --btn-hover: #ffffff; --track: #4a4e57;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 24px 48px -24px rgba(0, 0, 0, 0.7);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: #c5c8cf var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font);

{# the first stop for the Tab key: straight to the content #}
.skip { position: absolute; inset-inline-start: 12px; top: 8px; z-index: 20; background: var(--ink); color: var(--paper);
  padding: 10px 16px; border-radius: 8px; font-weight: 600; transform: translateY(-200%); }

{# top bar #}

  display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 15px; }

  border-radius: 10px; color: var(--ink); cursor: pointer; }

.page { max-width: 640px; margin: 0 auto; padding: 56px 24px 96px; display: flex; flex-direction: column; gap: 48px; }

.ring { position: relative; width: 208px; height: 208px; margin: 22px 0 12px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.ring .track { stroke: var(--fill); }

.warn .value { stroke: var(--warn-ring); } .warn .verdict { color: var(--warn); background: var(--warn-tint); }

{# lists of rows that open #}

.block > h2 { font-family: var(--display); font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; padding-bottom: 10px; }

  text-align: center; font-variant-numeric: lining-nums; }

{# a row opens and closes at its own height, where the browser can animate that #}
@supports (interpolate-size: allow-keywords) {

  details::details-content { block-size: 0; overflow: clip;
    transition: block-size 280ms var(--ease-out), content-visibility 280ms allow-discrete; }
  details[open]::details-content { block-size: auto; }
}
summary:active { opacity: 0.6; }
.inside { padding: 0 0 22px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 16px; }
.inside .fix { color: var(--ink); }
.inside .by { font-size: 14px; }
.tech { font-size: 14px; margin-top: 6px; }
.tech > summary { display: inline-flex; min-height: 44px; padding: 0; color: var(--accent); }
.tech ul { padding-top: 6px; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 2px; }
.inside.nested { padding-inline-start: calc(1.1ch * 1.53 + 14px); }
.rows.nested > details:last-child { border-bottom: 0; }

{# AI comparison #}
.bars { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 8px; color: var(--ink); }
.bars li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 16px; }
.bars .you span { font-weight: 600; }
.bars b { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars .line { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }

.asked { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 15px; }

.how { font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.how > summary { display: block; min-height: 56px; padding: 16px 0; color: var(--ink); font-weight: 600; }

.since { background: var(--fill); border: 0; border-radius: 16px; padding: 20px 20px 18px;
  display: flex; flex-direction: column; gap: 14px; }

.note { font-size: 14px; color: var(--muted); text-align: center; }

{# form #}
.hello { display: flex; flex-direction: column; gap: 10px; }
h1 { font-family: var(--display); font-size: 44px; line-height: 1.08; letter-spacing: -0.025em; font-weight: 600; text-wrap: balance; }

.field { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 14px; font-weight: 600; }
input, textarea { font: inherit; color: inherit; background: var(--card); width: 100%; min-height: 54px;
  border: 1px solid #868b95; border-radius: 12px; padding: 12px 16px;
  transition: border-color 140ms ease, box-shadow 140ms ease; }
input:focus, textarea:focus { outline: none; border-color: var(--mark); box-shadow: 0 0 0 4px rgba(23, 70, 224, 0.16); }
input[dir="ltr"] { text-align: left; }
input::placeholder, textarea::placeholder { color: #6b6f78; }
[data-theme="dark"] input, [data-theme="dark"] textarea { border-color: #6b7079; }
[data-theme="dark"] input::placeholder, [data-theme="dark"] textarea::placeholder { color: #9a9ea7; }
[data-theme="dark"] .alert { color: #ffb4ab; border-color: #5a2a25; }
{# a field the browser fills in keeps the page's own ground and ink #}
input:-webkit-autofill, textarea:-webkit-autofill { -webkit-text-fill-color: var(--ink); caret-color: var(--ink);

.btn { font: inherit; font-weight: 600; color: var(--paper); background: var(--ink); border: 0; border-radius: 12px;
  min-height: 54px; padding: 0 28px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: background-color 160ms ease, transform 120ms var(--ease-out); }
.btn:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--btn-hover); }
  .btn.danger:hover { background: #a3251f; }
}
.prose ul { list-style: disc; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 6px; }
.prose .block { gap: 8px; }
.prose .block > h2 { padding-bottom: 2px; }
.prose b { font-weight: 600; }
.consent { margin-top: 0; text-align: center; }
.consent a { text-decoration: underline; }
.hint { font-size: 14px; color: var(--muted); margin-top: -8px; }
.extra > summary { display: inline-flex; min-height: 44px; padding: 0; color: var(--accent); font-size: 15px; font-weight: 500; }
.extra[open] > summary { margin-bottom: 8px; }
.extra .field + .field { margin-top: 16px; }
.extra .field .hint { margin-top: 6px; }
.score .guessed { font-size: 13px; max-width: 34ch; text-align: center; }
.alert { background: var(--bad-tint); color: #a1211a; border: 1px solid #f3c5c1; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 500; }
.runs a { display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; gap: 14px; align-items: center;
  min-height: 60px; padding: 10px 0; color: var(--ink); }
.runs a:active { opacity: 0.6; }
.runs b { font-weight: 600; overflow-wrap: anywhere; }
.runs span { font-size: 14px; color: var(--muted); white-space: nowrap; }
.runs .ico { color: #8a8f99; }
@media (hover: hover) and (pointer: fine) { .runs a:hover b { text-decoration: underline; text-underline-offset: 0.2em; } }

{# what-if score #}
.lede { color: var(--muted); font-size: 16px; padding-bottom: 8px; }
.ticks li { display: flex; align-items: center; gap: 14px; min-height: 56px; }
.ticks input { flex: none; width: 22px; height: 22px; min-height: 0; padding: 0; margin: 0; accent-color: var(--accent); }

.whatif-out b { font-family: var(--display); font-size: 44px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: lining-nums tabular-nums; }

{# waiting #}
.live { display: flex; flex-direction: column; gap: 4px; text-align: start; width: min(320px, 100%); }
.live li { display: flex; align-items: center; gap: 12px; min-height: 40px; font-weight: 500; }
.live li.next { color: var(--muted); font-weight: 400; }
.live i { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }

.live .now i { border-color: var(--line); border-top-color: var(--accent); animation: turn 800ms linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.waiting { align-items: center; text-align: center; padding-top: 104px; gap: 22px; }
.waiting h1 { font-size: 36px; }
.waiting p { color: var(--muted); }
.scan { width: min(320px, 100%); height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.scan::before { content: ""; display: block; height: 100%; width: 40%; border-radius: 2px; background: var(--mark);
  animation: scan 1400ms var(--ease-in-out) infinite alternate; }
@keyframes scan { from { transform: translateX(60%); } to { transform: translateX(-210%); } }
.doing { display: grid; font-weight: 500; color: var(--ink); min-height: 1.6em; }
.doing li { grid-area: 1 / 1; opacity: 0; animation: doing3 7.2s linear infinite; animation-delay: calc(var(--i) * 2.4s); }
.doing.two li { animation-name: doing2; animation-duration: 4.8s; }
@keyframes doing3 { 0%, 33.3%, 100% { opacity: 0; } 4%, 29% { opacity: 1; } }
@keyframes doing2 { 0%, 50%, 100% { opacity: 0; } 6%, 44% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .ring .value, .scan::before { animation: none; }

  .scan::before { width: 100%; opacity: 0.35; }
  .doing li { animation: none; }
  .doing li:first-child { opacity: 1; }
  .btn, summary .ico, .bar .go { transition: none; }

}
@media (max-width: 520px) {
  .page { padding: 36px 20px 72px; gap: 40px; }
  .bar div { padding: 0 20px; }
  h1 { font-size: 34px; }

}
