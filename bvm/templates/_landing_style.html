<style>
{# The home page is a white gallery wall: one centred statement, the address field, then the
   product's own output shown as a single large exhibit. Sections alternate between white and
   a pale grey so each one reads as its own room, and the page ends on black. #}
.landing { overflow-x: clip; }
.wrap { --pad: clamp(20px, 4vw, 48px); max-width: 1240px; margin: 0 auto; padding: 0 var(--pad); }
.landing h2 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 4vw, 54px); line-height: 1.08; letter-spacing: -0.035em; text-wrap: balance; }
.landing h3 { font-size: 16px; font-weight: 600; }
.small { font-size: 15px; color: var(--muted); }

{# first screen #}
.hero { padding: clamp(40px, 5.5vw, 80px) 0 clamp(56px, 7vw, 96px); text-align: center; }
.hero .wrap { display: flex; flex-direction: column; align-items: center; }
.hero h1 { font-size: clamp(38px, 6vw, 80px); line-height: 1.02; font-weight: 600; letter-spacing: -0.045em; max-width: 12em; text-wrap: balance; }
.lead { font-size: clamp(18px, 1.7vw, 22px); line-height: 1.55; color: var(--muted); max-width: 32em; margin-top: clamp(18px, 2vw, 28px); }
.hero-form { width: 100%; max-width: 580px; gap: 10px; margin-top: clamp(28px, 3vw, 40px); }
.hero-form label { color: var(--muted); font-weight: 500; }
.hero-form .field-row { display: flex; flex-direction: row; gap: 6px; background: var(--card); border: 1px solid var(--edge); border-radius: 16px; padding: 6px;
  box-shadow: 0 1px 2px rgba(11, 12, 15, 0.04), 0 10px 28px -14px rgba(11, 12, 15, 0.18);
  transition: border-color 160ms ease, box-shadow 160ms ease; }
.hero-form .field-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(23, 70, 224, 0.14); }
.hero-form input { flex: 1; min-width: 0; min-height: 52px; border: 0; background: none; border-radius: 10px; padding: 0 16px; }
.hero-form input:focus { box-shadow: none; }
.hero-form .btn { min-height: 52px; padding: 0 26px; border-radius: 11px; white-space: nowrap; }
.facts { font-size: 14px; color: var(--muted); max-width: 40em; margin-top: 16px; }
.facts a { color: var(--ink); text-decoration: underline; white-space: nowrap; }
.facts.consent-line { margin-top: 4px; font-size: 13px; }
.after-h { font-size: clamp(18px, 1.5vw, 21px); color: var(--muted); max-width: 36em; margin-top: 18px; }
.small a { color: var(--ink); text-decoration: underline; }

{# the exhibit: one AI answer beside the score it leads to #}
.stage { width: 100%; max-width: 1040px; margin-top: clamp(40px, 5vw, 64px); text-align: start;
  display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  background: var(--card); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); }
.stage > div { padding: clamp(22px, 3vw, 40px); display: flex; flex-direction: column; gap: 16px; }
.stage-score { border-inline-start: 1px solid var(--line); align-items: center; text-align: center; }
.stage-top { display: flex; justify-content: space-between; align-self: stretch; font-size: 14px; color: var(--muted); }
.stage-top b { color: var(--ink); font-weight: 600; }
.ask { font-size: 17px; color: var(--muted); }
.answer { font-weight: 500; font-size: clamp(22px, 2.5vw, 34px); line-height: 1.45; letter-spacing: -0.02em; text-wrap: pretty; }
.answer mark { color: var(--ink); padding: 0 0.18em; border-radius: 4px; white-space: nowrap;
  background: var(--tint); }
.miss { display: inline-flex; align-items: center; gap: 10px; color: var(--bad); font-weight: 600; font-size: 16px; margin-top: auto;
  padding-top: 16px; border-top: 1px solid var(--line); }
.stage-score .ring { width: 168px; height: 168px; margin: 6px 0 0; }
.stage-score .ring b { font-size: 66px; }
.stage-score .ring small { font-size: 13px; margin-top: 6px; }
.stage-score p { font-size: 15px; color: var(--muted); max-width: 18em; }

{# One entrance, on the first screen only. Hidden only when a script is there to show it. #}
.js .rise { opacity: 0; }
.js.shown .rise { opacity: 1; }
.js.go .rise { opacity: 1; animation: rise 500ms var(--ease-out) both; animation-delay: calc(var(--d) * 50ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

{# the statement #}
.say { padding: clamp(56px, 8vw, 112px) 0; }
.say-text { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4.6vw, 68px); line-height: 1.14; letter-spacing: -0.04em; max-width: 17em; text-wrap: balance; }
.say-text em { font-style: normal; }
.say-text em { color: var(--accent); }

{# the comparison: the same question answered without the business and with it #}
.ba { margin-top: clamp(36px, 5vw, 64px); max-width: 860px; display: flex; flex-direction: column; gap: 14px; }
.ba-view { --p: 50%; position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.ba-pane { padding: clamp(20px, 3vw, 36px); display: flex; flex-direction: column; gap: 12px; }
.ba-tag { font-size: 14px; font-weight: 600; color: var(--muted); }
.ba-after { position: absolute; inset: 0; background: var(--tint-soft); clip-path: inset(0 0 0 calc(100% - var(--p))); }
.ba-after .ba-tag { color: var(--accent); }
.ba mark.you { background: var(--mark); color: var(--on-mark); }
.ba-line { position: absolute; top: 0; bottom: 0; right: var(--p); width: 2px; margin-right: -1px; background: var(--accent); }
.ba-ctl { display: none; flex-direction: column; gap: 2px; }
.js .ba-ctl { display: flex; }
.ba-ctl label { font-weight: 500; color: var(--muted); }
.ba-ctl input { direction: rtl; min-height: 44px; padding: 0; border: 0; background: none; accent-color: var(--accent); cursor: ew-resize; }
.ba-ctl input:focus { box-shadow: none; }

{# sections: white rooms and pale grey rooms #}
.part { padding: clamp(56px, 7.5vw, 104px) 0; }
.part.band { background: var(--fill); }
.aside { display: grid; grid-template-columns: minmax(0, 0.55fr) minmax(0, 1fr); gap: clamp(32px, 7vw, 120px); align-items: start; }
.aside > h2 { position: sticky; top: 104px; }
.split { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr); gap: clamp(36px, 7vw, 120px); align-items: center; }
.split.flip > .copy { order: 2; }
.copy { display: flex; flex-direction: column; gap: 20px; }
.copy p { max-width: 32em; }
.copy p:not(.small) { font-size: clamp(18px, 1.5vw, 21px); color: var(--muted); }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 24px 28px 14px;
  display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.sheet-top { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
.sheet-top b { font-weight: 600; }
.sheet-top span { color: var(--muted); font-size: 13px; }
.sheet .bars .line i { width: var(--w); }
.sheet .asked { padding-bottom: 10px; }
.sheet .rows > :last-child { border-bottom: 0; }

.ledger { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: clamp(32px, 7vw, 120px); margin-top: clamp(36px, 4vw, 56px); }
.ledger h3 { padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
.checks.two { columns: 2; column-gap: 48px; }
.checks li { break-inside: avoid; display: flex; align-items: baseline; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.checks li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); transform: translateY(-3px); }

.steps { counter-reset: s; border-top: 1px solid var(--ink); }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2.4ch minmax(0, 1fr); gap: 6px 28px; align-items: baseline;
  padding: 30px 0; border-bottom: 1px solid var(--line); }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 300; font-size: 44px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: lining-nums; color: var(--accent); }
.steps b { font-family: var(--display); font-size: clamp(21px, 2vw, 26px); font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
.steps p { grid-column: 2; color: var(--muted); font-size: 18px; max-width: 30em; }

.plainlist li { padding: 20px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 20px; }
.plainlist li:first-child { border-top: 1px solid var(--ink); }
.plainlist b { font-weight: 600; display: flex; align-items: center; gap: 12px; align-self: start; }
.pic { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.plainlist p { color: var(--muted); }

.faq > :first-child { border-top: 1px solid var(--ink); }
.faq summary { min-height: 72px; font-size: 19px; }
.faq .inside { font-size: 17px; max-width: 44em; }

{# the page ends on black #}
.close { background: var(--night); color: var(--night-ink); padding: clamp(72px, 9vw, 128px) 0; text-align: center; }
.close .wrap { display: flex; flex-direction: column; align-items: center; gap: clamp(28px, 4vw, 44px); }
.close h2 { font-size: clamp(36px, 5.4vw, 72px); line-height: 1; letter-spacing: -0.045em; }
.close .btn { min-height: 58px; padding: 0 34px; font-size: 18px; background: var(--night-ink); color: var(--night); }
@media (hover: hover) and (pointer: fine) { .close .btn:hover { background: #e4e6eb; } }
.foot { background: var(--night); color: var(--night-muted); border-top: 1px solid #23252b; font-size: 14px; padding: 28px 0; }
.foot .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.foot-logo { color: var(--night-ink); }
.foot-logo .logo { height: 24px; }
.foot nav { display: flex; gap: 22px; }
.foot a { color: var(--night-ink); min-height: 44px; display: inline-flex; align-items: center; }
.close :focus-visible, .foot :focus-visible { outline-color: var(--night-ink); }

@media (max-width: 900px) {
  .split, .ledger, .aside { grid-template-columns: minmax(0, 1fr); }
  .aside > h2 { position: static; }
  .split.flip > .copy { order: 0; }
}
@media (max-width: 720px) {
  .stage { grid-template-columns: minmax(0, 1fr); border-radius: 22px; }
  .stage-score { border-inline-start: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 520px) {
  .hero-form .field-row { flex-direction: column; background: none; border: 0; padding: 0; gap: 10px; box-shadow: none; }
  .hero-form .field-row:focus-within { box-shadow: none; }
  .hero-form input { background: var(--card); border: 1px solid #868b95; border-radius: 12px; flex: none; min-height: 56px; text-align: center; }
  .hero-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(23, 70, 224, 0.14); }
  .hero-form .btn { width: 100%; min-height: 56px; border-radius: 12px; }
  .sheet { padding: 18px 18px 8px; border-radius: 18px; }
  .steps li::before { font-size: 36px; }
  .steps p { font-size: 17px; }
  .checks.two { columns: 1; }
  .plainlist li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .close .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .rise { animation: none !important; }
  .js .rise { opacity: 1; }
}
</style>
