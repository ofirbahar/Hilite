<style>
{# The marketing page. One loud moment: the AI answer in the hero, where competitors get
   the highlighter and the business does not. Everything after it is quiet. #}
.landing { overflow-x: clip; }
.wrap { --pad: 28px; max-width: 1120px; margin: 0 auto; padding: 0 var(--pad); }
.landing h2 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4.2vw, 52px); line-height: 1.1; text-wrap: balance; }
.landing h3 { font-size: 17px; font-weight: 600; }
.small { font-size: 15px; color: var(--muted); }

{# hero #}
.hero { padding: 72px 0 104px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; align-items: center; }
.hero-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
.hero h1 { font-size: clamp(44px, 6.6vw, 92px); line-height: 1.02; max-width: 9.5em; }
.lead { font-size: clamp(18px, 1.7vw, 22px); color: var(--muted); max-width: 30em; }
.hero-act { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; margin-top: 6px; }
.quiet { color: var(--ink); font-weight: 500; min-height: 44px; display: inline-flex; align-items: center;
  background: linear-gradient(currentColor, currentColor) no-repeat 100% calc(100% - 9px) / 100% 1px; transition: background-size 260ms var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .quiet:hover { background-size: 0% 1px; } }
.facts { font-size: 15px; color: var(--muted); }

{# Hidden only when a script is there to show it again; see the page script. #}
.js .rise { opacity: 0; }
.js.shown .rise { opacity: 1; }
.js.go .rise { opacity: 1; animation: rise 800ms var(--ease-out) both; animation-delay: calc(var(--d) * 80ms + 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }

{# the demo: an AI answer, then the report it leads to #}
.demo { position: relative; padding-bottom: 150px; }
.chat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px 52px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 14px; }
.chat-top, .sheet-top { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
.chat-top b, .sheet-top b { font-weight: 600; }
.chat-top span, .sheet-top span { color: var(--muted); font-size: 13px; }
.q { align-self: flex-start; background: var(--ink); color: var(--paper); border-radius: 16px 16px 16px 4px; padding: 9px 16px; font-weight: 500; }
[dir="rtl"] .q { border-radius: 16px 16px 4px 16px; }
.a { font-size: 19px; line-height: 1.75; }
.a .ln { display: block; }
.a mark { position: relative; background: none; color: inherit; font-weight: 600; white-space: nowrap; isolation: isolate; margin-inline: 3px; }
.a mark::before { content: ""; position: absolute; inset: 12% -3px 6%; background: var(--mark); border-radius: 3px; z-index: -1;
  transform-origin: 100% 50%; }
.miss { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; color: var(--bad); font-weight: 600;
  background: #fbe6e4; border-radius: 999px; padding: 6px 14px 6px 16px; }

.result { position: absolute; inset-inline-start: 9%; inset-inline-end: -4%; bottom: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; box-shadow: 0 2px 4px rgba(20, 32, 28, 0.06), 0 34px 60px -28px rgba(20, 32, 28, 0.4);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.result-score { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.result .ring { width: 124px; height: 124px; margin: 0; }
.result .ring b { font-size: 50px; }
.result .ring small { font-size: 12px; margin-top: 4px; }
.result .verdict { font-size: 14px; padding: 2px 12px; }
.mini li { display: grid; grid-template-columns: 1.1ch minmax(0, 1fr); gap: 12px; align-items: center; min-height: 46px; font-size: 16px; }
.mini li + li { border-top: 1px solid var(--line); }
.mini span { font-family: var(--display); font-weight: 900; font-size: 20px; line-height: 1; }
.mini b { font-weight: 600; }
.again { position: absolute; inset-inline-start: 0; bottom: -44px; font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0;
  min-height: 44px; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 0.25em; }
@media (hover: hover) and (pointer: fine) { .again:hover { color: var(--ink); } }

{# the demo's timeline; without .play everything rests in its final state #}
.demo.play .q { animation: pop 420ms var(--ease-out) 500ms both; }
.demo.play .ln { animation: write 900ms cubic-bezier(0.3, 0.6, 0.4, 1) both; }
.demo.play .ln:nth-child(1) { animation-delay: 1200ms; }
.demo.play .ln:nth-child(2) { animation-delay: 2100ms; }
.demo.play mark::before { animation: swipe 380ms var(--ease-out) both; }
.demo.play .ln:nth-child(1) mark:nth-of-type(1)::before { animation-delay: 3100ms; }
.demo.play .ln:nth-child(1) mark:nth-of-type(2)::before { animation-delay: 3320ms; }
.demo.play .ln:nth-child(2) mark::before { animation-delay: 3540ms; }
.demo.play .miss { animation: pop 420ms var(--ease-out) 4300ms both; }
.demo.play .result { animation: lift 700ms var(--ease-out) 5200ms both; }
.demo.play .ring .value { animation-delay: 5500ms; }
.demo.play .mini li { animation: pop 420ms var(--ease-out) both; }
.demo.play .mini li:nth-child(1) { animation-delay: 5900ms; }
.demo.play .mini li:nth-child(2) { animation-delay: 6020ms; }
.demo.play .mini li:nth-child(3) { animation-delay: 6140ms; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.97); } }
@keyframes write { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
@keyframes swipe { from { transform: scaleX(0); } }
@keyframes lift { from { opacity: 0; transform: translateY(28px); } }

{# the statement, read as you scroll #}
.say { background: var(--night); color: var(--night-ink); padding: clamp(96px, 16vw, 200px) 0; }
.say-text { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5.4vw, 76px); line-height: 1.16; max-width: 17em; text-wrap: balance; }
.say-text em { font-style: normal; }
.say-text .w { opacity: 0.5; transition: opacity 260ms ease, color 260ms ease; }
.say-text .w.on { opacity: 1; }
.say-text em .w.on { color: var(--mark); }
.say ::selection { background: var(--mark); color: var(--night); }

{# sections #}
.part { padding: clamp(72px, 10vw, 136px) 0; }
.part + .part { padding-top: 0; }
.part + .part > .wrap { position: relative; padding-top: clamp(72px, 10vw, 136px); }
.part + .part > .wrap::before { content: ""; position: absolute; top: 0; inset-inline: var(--pad); border-top: 1px solid var(--line); }
.aside { display: grid; grid-template-columns: minmax(0, 0.5fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 88px); align-items: start; }
.aside > h2 { position: sticky; top: 100px; }
.split { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 88px); align-items: center; }
.split.flip > .copy { order: 2; }
.copy { display: flex; flex-direction: column; gap: 18px; }
.copy p { max-width: 32em; }
.copy p:not(.small) { font-size: 19px; color: var(--muted); }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 24px 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 16px; }
.sheet .bars .line i { width: var(--w); }
.sheet .asked { padding-bottom: 10px; }
.sheet .rows > :last-child { border-bottom: 0; }

.ledger { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 88px); margin-top: 44px; }
.ledger h3 { padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.checks.two { columns: 2; column-gap: 40px; }
.checks li { break-inside: avoid; display: flex; align-items: baseline; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.checks li::before { content: ""; flex: none; width: 14px; height: 8px; border-radius: 2px; background: var(--mark); transform: translateY(-1px); }

.steps { counter-reset: s; border-top: 2px solid var(--ink); }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2.4ch minmax(0, 1fr);
  gap: 6px 28px; align-items: baseline; padding: 28px 0; border-bottom: 1px solid var(--line); }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1; font-variant-numeric: lining-nums; }
.steps b { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.2; }
.steps p { grid-column: 2; color: var(--muted); font-size: 19px; max-width: 30em; }

.plainlist li { padding: 18px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 20px; }
.plainlist li:first-child { border-top: 2px solid var(--ink); }
.plainlist b { font-weight: 600; }
.plainlist p { color: var(--muted); }

.faq > :first-child { border-top: 2px solid var(--ink); }
.faq .inside { font-size: 17px; max-width: 44em; }

.close { background: var(--mark); padding: clamp(88px, 13vw, 176px) 0; }
.close .wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 32px; }
.close h2 { font-weight: 900; font-size: clamp(44px, 8.4vw, 124px); line-height: 1; }
.close .btn { min-height: 60px; padding: 0 36px; font-size: 19px; }
.close ::selection { background: var(--ink); color: var(--mark); }

.foot { background: var(--night); color: var(--night-muted); font-size: 14px; padding: 28px 0; }
.foot .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.foot-logo { color: var(--night-ink); }
.foot-logo .logo { height: 26px; }
.foot nav { display: flex; gap: 22px; }
.foot a { color: var(--night-ink); min-height: 44px; display: inline-flex; align-items: center; }

@media (max-width: 900px) {
  .hero { padding: 44px 0 96px; }
  .hero-grid, .split, .ledger, .aside { grid-template-columns: minmax(0, 1fr); }
  .aside > h2 { position: static; }
  .split.flip > .copy { order: 0; }
  .hero-grid { gap: 48px; }
  .result { inset-inline-start: 5%; inset-inline-end: -2%; }
}
@media (max-width: 520px) {
  .wrap { --pad: 20px; }
  .hero-act .btn { width: 100%; }
  .a { font-size: 17px; }
  .hero { padding: 32px 0 64px; }
  .hero-grid { gap: 36px; }
  .demo { padding-bottom: 0; display: flex; flex-direction: column; gap: 12px; }
  .chat { padding: 16px 18px 20px; }
  .result { position: static; gap: 14px; padding: 16px 18px; }
  .result .ring { width: 92px; height: 92px; }
  .result .ring b { font-size: 38px; }
  .result .ring small { font-size: 11px; margin-top: 2px; }
  .result .verdict { font-size: 13px; padding: 2px 10px; }
  .mini li { font-size: 15px; gap: 8px; min-height: 44px; }
  .sheet { padding: 16px 18px 8px; }
  .steps li::before { font-size: 36px; }
  .steps b { font-size: 22px; }
  .steps p { font-size: 17px; }
  .again { position: static; align-self: flex-start; }
  .checks.two { columns: 1; }
  .plainlist li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .close .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .rise, .demo.play *, .demo.play mark::before { animation: none !important; }
  .say-text .w { transition: none; }
  .js .rise { opacity: 1; }
  .quiet { transition: none; }
}
</style>
