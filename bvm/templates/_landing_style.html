<style>
{# The home page is set like the opening spread of a printed annual report, at night:
   one very large headline across the full measure, a rule, then the offer beside a
   specimen of what the product looks at. Type and rules carry the page; there are no
   panels in the first screen. Yellow is only the marker. #}
.landing { overflow-x: clip; }
.wrap { --pad: clamp(20px, 4vw, 56px); max-width: 1360px; margin: 0 auto; padding: 0 var(--pad); }
.landing h2 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 5.2vw, 72px); line-height: 1.04; text-wrap: balance; }
.landing h3 { font-size: 17px; font-weight: 600; }
.small { font-size: 15px; color: var(--muted); }

{# first screen #}
.hero { padding: clamp(36px, 5vw, 72px) 0 clamp(72px, 9vw, 136px); border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(54px, 12.4vw, 196px); line-height: 0.96; font-weight: 900; text-wrap: balance;
  padding-bottom: clamp(28px, 4.4vw, 64px); border-bottom: 1px solid var(--line); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr); gap: clamp(36px, 7vw, 120px);
  align-items: start; padding-top: clamp(28px, 4.4vw, 64px); }
.hero-copy { display: flex; flex-direction: column; gap: 22px; }
.lead { font-size: clamp(19px, 1.75vw, 24px); line-height: 1.5; color: var(--muted); max-width: 30em; }
.hero-form { max-width: 560px; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.hero-form label { color: var(--muted); font-weight: 500; }
.hero-form .field-row { display: flex; flex-direction: row; gap: 6px; background: var(--card); border: 1px solid #3b4a44; border-radius: 12px; padding: 6px;
  transition: border-color 160ms ease; }
.hero-form .field-row:focus-within { border-color: var(--mark); }
.hero-form input { flex: 1; min-width: 0; min-height: 52px; border: 0; background: none; border-radius: 8px; padding: 0 16px; }
.hero-form input:focus { box-shadow: none; }
.hero-form .btn { min-height: 52px; padding: 0 26px; border-radius: 8px; white-space: nowrap; }
.facts { font-size: 15px; color: var(--muted); max-width: 36em; }
.facts a { color: var(--ink); text-decoration: underline; white-space: nowrap; }

{# the specimen: one AI answer, set as text, with the marker on the names it gave #}
.specimen { display: flex; flex-direction: column; gap: 16px; }
.specimen figcaption { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted);
  padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.ask { font-size: 18px; color: var(--muted); }
.answer { font-family: var(--display); font-size: clamp(26px, 3vw, 44px); line-height: 1.42; text-wrap: pretty; }
.answer mark { color: var(--on-mark); padding: 0 0.16em; border-radius: 2px; white-space: nowrap;
  background: linear-gradient(var(--mark), var(--mark)) no-repeat 100% 50% / 100% 86%; }
.miss { display: inline-flex; align-items: center; gap: 10px; color: var(--bad); font-weight: 600; font-size: 18px;
  padding-top: 14px; border-top: 1px solid var(--line); }

{# One entrance, on the first screen only. Hidden only when a script is there to show it. #}
.js .rise { opacity: 0; }
.js.shown .rise { opacity: 1; }
.js.go .rise { opacity: 1; animation: rise 900ms var(--ease-out) both; animation-delay: calc(var(--d) * 90ms + 60ms); }
.js.go .answer mark { animation: strike 520ms var(--ease-out) both; }
.js.go .answer mark:nth-of-type(1) { animation-delay: 1000ms; }
.js.go .answer mark:nth-of-type(2) { animation-delay: 1260ms; }
.js.go .answer mark:nth-of-type(3) { animation-delay: 1520ms; }
.js.go .miss { animation: rise 700ms var(--ease-out) 2100ms both; }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } }
@keyframes strike { from { background-size: 0% 86%; color: var(--ink); } }

{# the statement, read as you scroll #}
.say { padding: clamp(96px, 14vw, 200px) 0; }
.say-text { font-family: var(--display); font-weight: 700; font-size: clamp(32px, 6vw, 96px); line-height: 1.12; max-width: 16em; text-wrap: balance; }
.say-text em { font-style: normal; }
.say-text .w { opacity: 0.5; transition: opacity 260ms ease; }
.say-text .w.on { opacity: 1; }
.say-text em .w { padding: 0 0.16em; margin: 0 -0.16em; background: linear-gradient(var(--mark), var(--mark)) no-repeat 100% 50% / 0% 88%;
  transition: opacity 260ms ease, background-size 360ms var(--ease-out), color 260ms ease; }
.say-text em .w.on { background-size: 100% 88%; color: var(--on-mark); }

{# sections: parted by a hairline and by room #}
.part { padding: clamp(80px, 11vw, 160px) 0; }
.part + .part, .say + .part { padding-top: 0; }
.part + .part > .wrap, .say + .part > .wrap { position: relative; padding-top: clamp(80px, 11vw, 160px); }
.part + .part > .wrap::before, .say + .part > .wrap::before { content: ""; position: absolute; top: 0; inset-inline: var(--pad); border-top: 1px solid var(--line); }
.aside { display: grid; grid-template-columns: minmax(0, 0.55fr) minmax(0, 1fr); gap: clamp(32px, 7vw, 120px); align-items: start; }
.aside > h2 { position: sticky; top: 100px; }
.split { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr); gap: clamp(36px, 7vw, 120px); align-items: center; }
.split.flip > .copy { order: 2; }
.copy { display: flex; flex-direction: column; gap: 20px; }
.copy p { max-width: 32em; }
.copy p:not(.small) { font-size: clamp(18px, 1.5vw, 21px); color: var(--muted); }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px 12px;
  display: flex; flex-direction: column; gap: 16px; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
.sheet-top b { font-weight: 600; }
.sheet-top span { color: var(--muted); font-size: 13px; }
.sheet .bars .line i { width: var(--w); }
.sheet .asked { padding-bottom: 10px; }
.sheet .rows > :last-child { border-bottom: 0; }
.sheet-score { display: flex; align-items: center; gap: 22px; padding: 6px 0 4px; }
.sheet-score .ring { width: 104px; height: 104px; margin: 0; flex: none; }
.sheet-score .ring b { font-size: 42px; }
.sheet-score .ring small { font-size: 11px; margin-top: 3px; }
.sheet-score p { color: var(--muted); font-size: 15px; margin-top: 8px; }

.ledger { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: clamp(32px, 7vw, 120px); margin-top: clamp(36px, 4vw, 56px); }
.ledger h3 { padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
.checks.two { columns: 2; column-gap: 48px; }
.checks li { break-inside: avoid; display: flex; align-items: baseline; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.checks li::before { content: ""; flex: none; width: 12px; height: 7px; border-radius: 1px; background: var(--mark); transform: translateY(-1px); }

.steps { counter-reset: s; border-top: 1px solid var(--ink); }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2.4ch minmax(0, 1fr); gap: 6px 28px; align-items: baseline;
  padding: 30px 0; border-bottom: 1px solid var(--line); }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1; font-variant-numeric: lining-nums; }
.steps b { font-family: var(--display); font-size: clamp(24px, 2.2vw, 32px); font-weight: 700; line-height: 1.2; }
.steps p { grid-column: 2; color: var(--muted); font-size: 19px; max-width: 30em; }

.plainlist li { padding: 20px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 20px; }
.plainlist li:first-child { border-top: 1px solid var(--ink); }
.plainlist b { font-weight: 600; }
.plainlist p { color: var(--muted); }

.faq > :first-child { border-top: 1px solid var(--ink); }
.faq summary { min-height: 72px; font-size: 19px; }
.faq .inside { font-size: 17px; max-width: 44em; }

.close { padding: clamp(96px, 14vw, 208px) 0 clamp(80px, 10vw, 144px); border-top: 1px solid var(--line); }
.close .wrap { display: flex; flex-direction: column; align-items: flex-start; gap: clamp(28px, 4vw, 48px); }
.close h2 { font-weight: 900; font-size: clamp(54px, 12.4vw, 196px); line-height: 0.96; }
.close .btn { min-height: 58px; padding: 0 34px; font-size: 18px; }

.foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; padding: 28px 0; }
.foot .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.foot-logo { color: var(--ink); }
.foot-logo .logo { height: 26px; }
.foot nav { display: flex; gap: 22px; }
.foot a { color: var(--ink); min-height: 44px; display: inline-flex; align-items: center; }

@media (max-width: 900px) {
  .hero-grid, .split, .ledger, .aside { grid-template-columns: minmax(0, 1fr); }
  .aside > h2 { position: static; }
  .split.flip > .copy { order: 0; }
}
@media (max-width: 520px) {
  .hero-form .field-row { flex-direction: column; background: none; border: 0; padding: 0; gap: 10px; }
  .hero-form input { background: var(--card); border: 1px solid #3b4a44; border-radius: 10px; flex: none; min-height: 56px; }
  .hero-form .btn { width: 100%; min-height: 56px; border-radius: 10px; }
  .sheet { padding: 18px 18px 8px; }
  .steps li::before { font-size: 36px; }
  .steps p { font-size: 17px; }
  .checks.two { columns: 1; }
  .plainlist li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .close .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .rise, .answer mark, .miss { animation: none !important; }
  .say-text .w, .say-text em .w { transition: none; }
  .js .rise { opacity: 1; }
}
</style>
