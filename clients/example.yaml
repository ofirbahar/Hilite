# Results should reflect what a buyer in this country sees.
target_country: US

# Questions buyers ask (used by the AI visibility check, later stage).
buyer_questions: []

# The approved one-line description of the company.
approved_description: ""

crawl:
  max_pages: 50
  delay_seconds: 0.5
  slow_page_seconds: 2.0
